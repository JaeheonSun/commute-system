<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로그인 | 출퇴근 관리</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    :root {
      --blue:     #2563eb;
      --blue-700: #1d4ed8;
      --blue-50:  #eff6ff;
      --border:   #e2e8f0;
      --text:     #0f172a;
      --muted:    #64748b;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #dbeafe 0%, #f1f5f9 50%, #e0f2fe 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-wrap {
      width: 100%;
      max-width: 400px;
    }

    /* Logo area */
    .login-logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-icon {
      width: 52px; height: 52px;
      background: var(--blue);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.3rem;
      margin-bottom: 12px;
      box-shadow: 0 4px 14px rgba(37,99,235,0.35);
    }
    .login-logo h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
      margin: 0;
      letter-spacing: -0.02em;
    }
    .login-logo p {
      font-size: 0.82rem;
      color: var(--muted);
      margin: 4px 0 0;
    }

    /* Card */
    .login-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 32px 28px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    }

    /* Form */
    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }
    .input-wrap {
      position: relative;
      margin-bottom: 16px;
    }
    .input-icon {
      position: absolute;
      top: 50%;
      left: 13px;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 0.85rem;
      pointer-events: none;
    }
    .form-input {
      width: 100%;
      padding: 10px 12px 10px 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      background: #fff;
    }
    .form-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }
    .form-input::placeholder { color: #94a3b8; }

    /* Button */
    .btn-login {
      display: block;
      width: 100%;
      padding: 11px;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      margin-top: 8px;
      letter-spacing: 0.01em;
    }
    .btn-login:hover  { background: var(--blue-700); }
    .btn-login:active { transform: scale(0.99); }

    /* Footer */
    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.78rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

<div class="login-wrap">

  <div class="login-logo">
    <div class="logo-icon"><i class="fas fa-clock"></i></div>
    <h1>출퇴근 관리 시스템</h1>
    <p>계정으로 로그인해주세요</p>
  </div>

  <div class="login-card">
    <form method="post">

      <label class="form-label">아이디</label>
      <div class="input-wrap">
        <i class="fas fa-user input-icon"></i>
        <input type="text" name="username" class="form-input" placeholder="아이디 입력" required autofocus>
      </div>

      <label class="form-label">비밀번호</label>
      <div class="input-wrap">
        <i class="fas fa-lock input-icon"></i>
        <input type="password" name="password" class="form-input" placeholder="비밀번호 입력" required>
      </div>

      <button type="submit" class="btn-login">
        <i class="fas fa-sign-in-alt mr-1"></i> 로그인
      </button>

    </form>
  </div>

  <div class="login-footer">
    © 재단법인 한사람 출퇴근 관리 시스템
  </div>

</div>

</body>
</html>
