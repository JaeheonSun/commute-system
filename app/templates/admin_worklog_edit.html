{% extends "admin_base.html" %}

{% block title %}근무 기록 수정/삭제{% endblock %}

{% block content %}

<div class="row">

  <!-- 🔹 조회 카드 -->
  <div class="col-md-12">
    <div class="card card-info">
      <div class="card-header">
        <h3 class="card-title">근무 기록 조회</h3>
      </div>

      <form method="POST">
        <div class="card-body">
          <div class="row">

            <div class="col-md-4">
              <div class="form-group">
                <label>직원</label>
                <select name="user_id" class="form-control" required>
                  {% for u in users %}
                  {% if u.username != "peabodu509" %}
                  <option value="{{ u.id }}"
                    {% if selected_user == u.id %}selected{% endif %}>
                    {{ u.username }}
                  </option>
                  {% endif %}
                  {% endfor %}
                </select>
              </div>
            </div>

            <div class="col-md-4">
              <div class="form-group">
                <label>근무 날짜</label>
                <input type="date"
                       name="work_date"
                       class="form-control"
                       value="{{ selected_date if selected_date }}"
                       required>
              </div>
            </div>

          </div>
        </div>

        <div class="card-footer text-right">
          <button type="submit" class="btn btn-info">
            <i class="fas fa-search"></i> 조회
          </button>
        </div>
      </form>
    </div>
  </div>

  {% if record %}
  <!-- 🔹 수정 카드 -->
  <div class="col-md-12">
    <div class="card card-warning">
      <div class="card-header">
        <h3 class="card-title">근무 기록 수정/삭제</h3>
      </div>

      <form method="POST">
        <!-- 조회 조건 유지 -->
        <input type="hidden" name="user_id" value="{{ selected_user }}">
        <input type="hidden" name="work_date" value="{{ selected_date }}">

        <div class="card-body">
          <div class="row">
            <div class="col-md-3">
              <div class="form-group">
                <label>근무 형태</label>
                <select name="work_type" class="form-control">
                  <option value="office" {% if record.work_type == 'office' %}selected{% endif %}>재단근무</option>
                  <option value="remote" {% if record.work_type == 'remote' %}selected{% endif %}>재택근무</option>
                  <option value="flexible" {% if record.work_type == 'flexible' %}selected{% endif %}>시차(유연근무)</option>
                  <option value="annual_leave" {% if record.work_type == 'annual_leave' %}selected{% endif %}>연차</option>
                  <option value="half_day" {% if record.work_type == 'half_day' %}selected{% endif %}>반차</option>
                  <option value="special_leave" {% if record.work_type == 'special_leave' %}selected{% endif %}>특별휴가</option>
                  <option value="substitute_leave" {% if record.work_type == 'substitute_leave' %}selected{% endif %}>대체휴무</option>
                </select>
              </div>
            </div>

            <div class="col-md-3">
              <div class="form-group">
                <label>출근 시간</label>
                <input type="time"
                       name="start_time"
                       class="form-control"
                       value="{{ record.start_time.strftime('%H:%M') if record.start_time else '' }}">
              </div>
            </div>

            <div class="col-md-3">
              <div class="form-group">
                <label>퇴근 시간</label>
                <input type="time"
                       name="end_time"
                       class="form-control"
                       value="{{ record.end_time.strftime('%H:%M') if record.end_time else '' }}">
              </div>
            </div>

            <div class="col-md-3">
              <div class="form-group">
                <label>비고</label>
                <input type="text" name="remarks" class="form-control" value="{{ record.remarks or '' }}">
              </div>
            </div>

          </div>
        </div>

        <div class="card-footer text-right bg-white">
          <button type="submit" class="btn btn-success">
            <i class="fas fa-save"></i> 저장
          </button>
        </div>
      </form>

        <form method="POST"
            action="{{ url_for('admin.delete_worklog') }}"
            onsubmit="return confirm('정말 이 근무 기록을 삭제하시겠습니까?');"
            class="card-footer text-right bg-white">
        <input type="hidden" name="user_id" value="{{ selected_user }}">
        <input type="hidden" name="work_date" value="{{ selected_date }}">
        <button type="submit" class="btn btn-danger">
          <i class="fas fa-trash"></i> 삭제
        </button>
      </form>
    </div>
  </div>
  {% endif %}

</div>

{% endblock %}
