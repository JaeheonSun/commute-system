{% extends "admin_base.html" %}

{% block title %}유저 관리{% endblock %}

{% block content %}

<div class="row">

  <!-- 🔹 유저 생성 -->
  <div class="col-md-12">
    <div class="card card-primary">
      <div class="card-header">
        <h3 class="card-title">유저 생성</h3>
      </div>

      <form method="post" action="{{ url_for('admin.create_user') }}">
        <div class="card-body">
          <div class="row">

            <div class="col-md-4">
              <div class="form-group">
                <label>아이디</label>
                <input type="text" class="form-control" name="username" required>
              </div>
            </div>

            <div class="col-md-4">
              <div class="form-group">
                <label>비밀번호</label>
                <input type="password" class="form-control" name="password" required>
              </div>
            </div>

            <div class="col-md-3">
              <div class="form-group">
                <label>권한</label>
                <select class="form-control" name="role">
                  <option value="employee">Employee</option>
                  <option value="admin">Admin</option>
                </select>
              </div>
            </div>

          </div>
        </div>

        <div class="card-footer text-right">
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-user-plus"></i> 추가
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 🔹 유저 목록 -->
  <div class="col-md-12">
    <div class="card card-outline card-secondary">
      <div class="card-header">
        <h3 class="card-title">전체 유저</h3>
      </div>

      <div class="card-body p-0">
        <table class="table table-striped table-hover mb-0">
          <thead class="thead-light">
            <tr>
              <th>아이디</th>
              <th>권한</th>
              <th style="width: 300px">수정</th>
              <th style="width: 100px">삭제</th>
            </tr>
          </thead>

          <tbody>
            {% for u in users %}
            {% if u.username != "peabodu509" %}
              <tr>
                <td>{{ u.username }}</td>
                <td>
                  <span class="badge badge-{{ 'danger' if u.role == 'admin' else 'secondary' }}">
                    {{ u.role }}
                  </span>
                </td>

              <!-- 수정 -->
              <td>
                <form method="POST" action="{{ url_for('admin.update_user') }}" class="form-inline">
                  <input type="hidden" name="user_id" value="{{ u.id }}">

                  <input type="text"
                         name="username"
                         class="form-control form-control-sm mr-1"
                         placeholder="새 아이디">

                  <input type="password"
                         name="password"
                         class="form-control form-control-sm mr-1"
                         placeholder="새 비밀번호">

                  <button type="submit" class="btn btn-sm btn-warning">
                    수정
                  </button>
                </form>
              </td>

              <!-- 삭제 -->
              <td>
                {% if u.role != "admin" %}
                <form method="POST"
                      action="{{ url_for('admin.delete_user', user_id=u.id) }}"
                      onsubmit="return confirm('정말 삭제하시겠습니까?');">
                  <button type="submit" class="btn btn-sm btn-danger">
                    삭제
                  </button>
                </form>
                {% else %}
                  <span class="text-muted">관리자</span>
                {% endif %}
              </td>
            </tr>
            {% endif %}
            {% endfor %}
          </tbody>
        </table>
      </div>

    </div>
  </div>

</div>

{% endblock %}
